modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Drowningfish233"
description='''
Modular Silent Gear weapons and armor, ported from Reverie Foundry.
Every non-Silent-Gear weapon family is an optional integration: install the
corresponding mod and its gear is registered automatically, skip it and an
empty placeholder item keeps the ids valid.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"


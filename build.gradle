plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = 'Minecraft Libraries'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = 'NeoForged CDN Releases'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    maven {
        name = 'NeoForged CDN Mojang Meta'
        url = 'https://neoforged.forgecdn.net/mojang-meta'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def optionalMods = [
        'libs/malum-1.21.1-1.8.2.jar',
        'libs/lodestone-1.21.1-1.8.2.jar',
        'libs/irons_spellbooks-1.21.1-3.16.4.jar',
        'libs/irons_lib-1.21.1-2.4.0.jar',
        'libs/aces_spell_utils-1.2.7.5-1.21.1.jar',
        'libs/player-animation-lib-forge-2.0.4+1.21.1.jar',
        'libs/caelus-neoforge-7.0.1+1.21.1.jar',
        'libs/curios-neoforge-9.6.0-1.21.1.jar',
        'libs/Cataclysm-1.21.1-3.33.jar',
        'libs/lionfishapi-3.1.jar',
        'libs/terra_entity-1.2.3.jar',
        'libs/Jadens-Nether-Expansion-2.4.1.jar',
        'libs/ElysiumAPI-1.21.1-2.0.1.jar',
        'libs/geckolib-neoforge-1.21.1-4.9.4.jar',
        'libs/azurelib-neo-1.21.1-3.2.8.jar',
        'libs/hazennstuff-1.4.0.14.jar',
        'libs/hazentouvelib-1.0.14.jar',
        'libs/ApothicAttributes-1.21.1-2.9.1.jar',
        'libs/cobweb-neoforge-1.21-1.4.0.jar',
        'libs/prometheus-neoforge-1.21.1-1.2.5.jar',
        'libs/soul-fire-d-neoforge-1.21-6.1.0.jar',
]

dependencies {
    implementation files('libs/silent-gear-1.21.1-neoforge-4.2.1.1.jar')
    implementation files('libs/silent-lib-1.21-neoforge-10.3.1.jar')

    compileOnly files('libs/confluence_magic_lib-0.0.8.jar')

    compileOnly files(optionalMods)

    if (project.findProperty("withOptionalMods") != "false") {
        localRuntime files(optionalMods)
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation files('libs/silent-gear-1.21.1-neoforge-4.2.1.1.jar')
    implementation files('libs/silent-lib-1.21-neoforge-10.3.1.jar')

    compileOnly files('libs/malum-1.21.1-1.8.2.jar')
    compileOnly files('libs/lodestone-1.21.1-1.8.2.jar')
    compileOnly files('libs/irons_spellbooks-1.21.1-3.14.8.jar')
    compileOnly files('libs/Cataclysm 1.21.1-3.32.jar')
    compileOnly files('libs/terra_entity.jar')
    compileOnly files('libs/Jadens-Nether-Expansion-2.4.1.jar')
    compileOnly files('libs/ElysiumAPI-1.21.1-2.0.1.jar')
    compileOnly files('libs/geckolib.jar')
    compileOnly files('libs/ApothicAttributes-1.21.1-2.9.1.jar')
    compileOnly files('libs/curios-neoforge-9.5.1+1.21.1-api.jar')

    if (project.findProperty("withOptionalMods") != "false") {
        localRuntime files('libs/malum-1.21.1-1.8.2.jar')
        localRuntime files('libs/lodestone-1.21.1-1.8.2.jar')
        localRuntime files('libs/irons_spellbooks-1.21.1-3.14.8.jar')
        localRuntime files('libs/Cataclysm 1.21.1-3.32.jar')
        localRuntime files('libs/lionfishapi-3.1.jar')
        localRuntime files('libs/terra_entity.jar')
        localRuntime files('libs/Jadens-Nether-Expansion-2.4.1.jar')
        localRuntime files('libs/ElysiumAPI-1.21.1-2.0.1.jar')
        localRuntime files('libs/geckolib.jar')
        localRuntime files('libs/azurelib-neo-1.21.1-3.1.8.jar')
        localRuntime files('libs/hazennstuff-1.4.0.10.jar')
        localRuntime files('libs/ApothicAttributes-1.21.1-2.9.1.jar')
        localRuntime files('libs/curios-neoforge-9.5.1+1.21.1.jar')
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
